<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Process Mapping · POST205 Internal</title>
<style>
  :root {
    --black: #e7efee;            /* page ground (legacy token name) */
    --surface: #f7fcfc;
    --surface-2: #dce8e7;
    --surface-deep: #0D2828;
    --accent: #0e9a9d;           /* Body Teal, light-field accent */
    --accent-bright: #3BD1D3;    /* Teal Strike, on-dark only */
    --border: #c7d9d7;
    --border-2: #b1c8c5;
    --text: #0b1b1b;
    --text-2: #41585a;
    --text-3: #5a7473;
    --good: #198a4c;
    --bad: #c0392b;
    --mono: ui-monospace, monospace;
    --sans: system-ui, -apple-system, sans-serif;
    --bar-h: 52px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  html { overflow: hidden; } /* kills the transient scrollbar during load/inject */
  html, body { overscroll-behavior: none; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* no font inflation on iOS rotate */
  button, input, .nav-btn, .slide { touch-action: manipulation; } /* rapid Next taps must not double-tap zoom */
  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    overflow: hidden;
  }
  strong { font-weight: 700; }

  /* ── Gate ─────────────────────────────────────────────── */
  /* On-dark context: hardcoded colors, Teal Strike accent.  */
  #gate {
    position: fixed; inset: 0; z-index: 10;
    background: var(--surface-deep);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .gate-card { max-width: 420px; width: 100%; }
  /* the 15x5 logo pixel grid — same matrix as the homepage and email logo */
  .logo-grid { display: grid; grid-template-columns: repeat(15, 12px); grid-auto-rows: 12px; gap: 3px; margin-bottom: 26px; }
  .logo-grid i { display: block; border-radius: 2px; background: rgba(59, 209, 211, 0.07); }
  .logo-grid i.on { background: var(--accent-bright); }
  .closing { position: relative; }
  .closing p { position: relative; z-index: 1; }
  /* canvas pixel field (ported from /work): dim breathing cells, logo bright inside */
  .px-grid { position: absolute; inset: 0; pointer-events: none; }
  .gate-card { position: relative; z-index: 1; }
  .tick { font-variant-numeric: tabular-nums; }

  /* breathing lattice behind the slides — the login field on light, logo lives inside it */
  .slide-lattice { position: absolute; inset: 0; pointer-events: none; }

  /* inline SVG diagrams: same stroke language as the four shapes */
  .diagram { margin: 18px 0 0; }
  .diagram svg {
    display: block; width: 100%; max-width: 880px; height: auto;
    stroke: var(--accent); stroke-width: 2.5; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .diagram .dlabel {
    stroke: none; fill: var(--text-3);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  }
  .gate-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #7aacac; margin-bottom: 18px;
  }
  .gate-card h1 {
    font-weight: 800; font-size: clamp(34px, 4vw, 48px); line-height: 1.1;
    letter-spacing: -0.01em; color: #f0f7f7; margin-bottom: 12px;
  }
  .gate-sub { color: #a9c3c1; margin-bottom: 26px; }
  .gate-row { display: flex; gap: 10px; }
  #user, #pass {
    min-width: 0; width: 100%;
    background: #123434; border: 1px solid #1e4a4a; border-radius: 4px;
    color: #f0f7f7; font-family: var(--mono);
    font-size: 16px; /* unconditional: below 16px iOS zooms on focus at ANY width, incl. landscape */
    letter-spacing: 0.09em; padding: 11px 14px;
  }
  #user { margin-bottom: 10px; }
  #pass { flex: 1; }
  #user::placeholder, #pass::placeholder { color: #4d7472; font-size: 11px; letter-spacing: 0.12em; }
  #user:focus-visible, #pass:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 1px; }
  #open {
    background: var(--accent-bright); color: #021616; border: 0; border-radius: 4px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.09em; text-transform: uppercase;
    padding: 11px 22px; cursor: pointer;
  }
  #open:hover { opacity: 0.85; transition: opacity 0.15s; }
  #open:focus-visible { outline: 2px solid #f0f7f7; outline-offset: 2px; }
  #gate-err {
    color: #ffb3a7; margin-top: 14px; min-height: 1.7em; font-size: 14px;
  }

  /* ── Deck shell ───────────────────────────────────────── */
  #deck { position: fixed; inset: 0 0 var(--bar-h) 0; visibility: hidden; }
  #deck.on { visibility: visible; }
  .slide {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 28px 56px 20px;
  }
  .slide.active { display: flex; }
  .frame { width: 100%; max-width: 1160px; max-height: 100%; overflow-y: auto; scrollbar-width: none; }
  .frame::-webkit-scrollbar { display: none; } /* frames scroll (wheel/touch) but never flash a bar */

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 14px;
  }
  h1.display {
    font-weight: 800; font-size: clamp(44px, 5.5vw, 76px); line-height: 1.05;
    letter-spacing: -0.01em; margin-bottom: 28px; max-width: 15ch;
  }
  .slide h2 {
    font-weight: 800; font-size: clamp(26px, 3.2vw, 40px); line-height: 1.1;
    letter-spacing: -0.01em; margin-bottom: 16px;
  }
  .slide h3 { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 6px; }
  .lede { color: var(--text-2); max-width: 68ch; }
  .lede p + p { margin-top: 12px; }
  .standalone { margin-top: 20px; color: var(--text); font-size: 17px; }
  .foot { color: var(--text-2); margin-top: 20px; max-width: 78ch; }

  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 18px 20px;
  }
  .card p { color: var(--text-2); font-size: 14px; }
  .card p + p { margin-top: 10px; }
  .card p strong { color: var(--text); }
  .card.key { border-color: var(--accent); }
  .card.key .tag { color: var(--accent); }
  .card.status.good .tag { color: var(--good); }
  .card.status.bad .tag { color: var(--bad); }

  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; }
  .cols > * { min-width: 0; }
  .stack { display: grid; gap: 10px; }
  .card-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  .card-row > * { min-width: 0; }
  .card-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* Slide 01 */
  .title-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: start; }
  .slide-title .lede { font-size: 17px; }
  .meta { border-top: 1px solid var(--border-2); }
  .meta div { border-bottom: 1px solid var(--border-2); padding: 12px 0; }
  .meta dt {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 3px;
  }
  .meta dd { font-family: var(--mono); font-size: 12px; color: var(--text-2); line-height: 1.5; }

  /* Slide 04 — the four shapes */
  .shape-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
  .shape-item svg {
    width: 96px; height: 72px; display: block; margin-bottom: 10px;
    stroke: var(--accent); stroke-width: 2.5; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .shape-item p { color: var(--text-2); font-size: 14px; }

  /* Slide 05 — six moves */
  .moves { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px; margin-top: 24px; }
  .moves li { display: flex; gap: 14px; }
  .moves .num {
    font-family: var(--mono); font-size: 12px; color: var(--accent);
    border: 1px solid var(--border-2); border-radius: 4px;
    width: 26px; height: 26px; flex: none;
    display: flex; align-items: center; justify-content: center; margin-top: 3px;
  }
  .moves div { color: var(--text-2); font-size: 14px; }
  .moves strong { color: var(--text); }

  /* Checklists (slides 08, 13) */
  .checklist { list-style: none; margin-top: 20px; display: grid; gap: 12px; max-width: 82ch; }
  .checklist li { display: flex; gap: 12px; }
  .checklist .box { font-family: var(--mono); color: var(--accent); flex: none; margin-top: 1px; }
  .checklist div { color: var(--text-2); font-size: 14px; }
  .checklist strong { color: var(--text); }

  /* Slide 10 — escalation table */
  .table-scroll {
    overflow-x: auto; margin-top: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
  }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-3); font-weight: 400;
    text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  td {
    font-size: 13px; color: var(--text-2); line-height: 1.55;
    padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child { font-weight: 700; color: var(--text); white-space: nowrap; }
  td strong { color: var(--text); }
  .foot-card { margin-top: 14px; }
  .foot-card p { font-size: 14px; }

  /* Slide 11 — canon */
  .canon { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .canon dt { font-weight: 700; font-size: 14px; }
  .canon dd { color: var(--text-2); font-size: 13px; line-height: 1.55; }

  /* Slide 12 — handoff chain */
  .chain { list-style: none; display: flex; gap: 8px; align-items: stretch; margin-top: 22px; }
  .chain-node {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 16px 18px;
  }
  .chain-node p { color: var(--text-2); font-size: 13px; line-height: 1.55; }
  .chain-node .tag { margin-bottom: 6px; }
  .chain-arrow {
    align-self: center; font-family: var(--mono); font-size: 18px;
    color: var(--accent); flex: none;
  }
  .slide-chain .card-row { margin-top: 14px; }

  /* Slide 14 — sources + close */
  .slide-close .frame { overflow: visible; } /* let the closing band bleed past the frame */
  .cols.sources { grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .sources ul { list-style: none; }
  .sources li { color: var(--text-2); font-size: 13px; line-height: 1.5; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .sources li:last-child { border-bottom: 0; }
  .closing {
    /* On-dark context: hardcoded colors per DESIGN.md. Full-bleed band. */
    background: var(--surface-deep);
    margin: 26px calc(50% - 50vw) 0;
    padding: 34px calc(50vw - 50% + 8px) 38px;
  }
  .closing p { color: #c4d9d7; max-width: 62ch; font-size: 16px; }
  .closing p + p { margin-top: 12px; }
  .closing .sendoff strong { color: #3BD1D3; font-size: 18px; }

  /* ── Bottom bar ───────────────────────────────────────── */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar-h);
    display: none; align-items: center; gap: 20px;
    padding: 0 24px;
    background: transparent; /* the field runs underneath; the bar is just quiet marks */
    z-index: 5;
  }
  #bar.on { display: flex; }
  #counter {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em;
    color: var(--text-3); opacity: 0.65; flex: none; min-width: 60px;
  }
  #pips { flex: 1; display: flex; justify-content: center; gap: 7px; }
  .pip {
    width: 5px; height: 5px; padding: 0; border: 0; border-radius: 1px;
    background: rgba(14, 154, 157, 0.18); cursor: pointer;
  }
  .pip.on { background: var(--accent); }
  .pip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-btn {
    background: transparent; border: 0; color: var(--text-3);
    font-size: 18px; line-height: 1;
    padding: 12px 14px; cursor: pointer; flex: none; opacity: 0.7;
  }
  .nav-btn:hover { color: var(--accent); opacity: 1; transition: color 0.15s, opacity 0.15s; }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ── Mobile ───────────────────────────────────────────── */
  @media (max-width: 768px) {
    #open { padding: 13px 22px; }
    .logo-grid { grid-template-columns: repeat(15, 9px); grid-auto-rows: 9px; gap: 2.5px; }
    .slide { padding: 20px 20px 14px; align-items: flex-start; }
    .frame { padding-top: 4px; }
    .cols, .card-row, .card-row.two, .title-cols, .canon, .moves { grid-template-columns: minmax(0, 1fr); }
    .title-cols { gap: 24px; }
    .cols { gap: 16px; }
    .moves { gap: 12px; margin-top: 16px; }
    .card-row { margin-top: 14px; }
    .shape-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .cols.sources { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chain { flex-direction: column; gap: 6px; }
    .chain-arrow { align-self: flex-start; transform: rotate(90deg); padding-left: 18px; }
    th, td { padding: 8px 10px; font-size: 12.5px; }
    .diagram { overflow-x: auto; } /* diagram scrolls in its own container, labels stay legible */
    .diagram svg { min-width: 560px; }
    .closing { margin: 20px calc(50% - 50vw) 0; padding: 24px 20px 28px; }
    #bar {
      height: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
      padding: 0 14px env(safe-area-inset-bottom, 0px);
      gap: 14px;
    }
    #deck { inset: 0 0 calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)) 0; }
    .nav-btn { padding: 15px 16px; } /* 44px tap target */
    #counter { min-width: 56px; }
    #pips { display: none; } /* swipe + chevrons carry it; 5px pips are no tap target */
  }
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gate-form">
    <p class="gate-label">POST205 · INTERNAL</p>
    <h1>Come on in.</h1>
    <p class="gate-sub">Team access only. The passphrase is in the chat, or ask Toffer.</p>
    <input id="user" type="text" name="username" autocomplete="username" aria-label="Username"
           placeholder="USERNAME" autocapitalize="none" spellcheck="false" autofocus>
    <div class="gate-row">
      <input id="pass" type="password" name="password" autocomplete="current-password"
             aria-label="Passphrase" placeholder="PASSPHRASE">
      <button id="open" type="submit">Open</button>
    </div>
    <p id="gate-err" aria-live="polite"></p>
  </form>
</div>

<main id="deck" aria-label="Slides"></main>

<div id="bar">
  <span id="counter">01 / 14</span>
  <div id="pips" aria-hidden="true"></div>
  <button class="nav-btn" id="prev" aria-label="Previous slide">‹</button>
  <button class="nav-btn" id="next" aria-label="Next slide">›</button>
</div>

<script type="module">
import { animate, createTimeline, stagger } from '/js/vendor/anime.esm.min.js';

const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── Gate: AES-GCM decrypt, wrong key throws ─────────────── */
async function unlock(passphrase) {
  const { salt, iv, ct } = await fetch('./deck.enc.json').then(r => r.json());
  const b = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b(salt), iterations: 250000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(iv) }, key, b(ct));
  return new TextDecoder().decode(plain);
}

const gate = document.getElementById('gate');
const err = document.getElementById('gate-err');
const passEl = document.getElementById('pass');

/* ── the 15x5 logo bitmap: same matrix as the homepage and email logo ──── */
const M = ['001011101110111', '100000101010100', '010011101010111', '000010001010001', '100011101110111'];
const seedRand = (i) => { const x = Math.sin((i + 1) * 127.1) * 43758.5453; return x - Math.floor(x); };
const DPR2 = Math.min(window.devicePixelRatio || 1, 2);
/* light-field palette anchors (kawa mixes FIRE↔DUN; we stay inside the teal family
   — a gray partner reads as dirt on the off-white field) */
const TEAL = [14, 154, 157], MUTE = [64, 168, 164];

/* sparse ambient lattice on the light field — every cell breathes on its own
   seeded frequency and phase, same grammar as kawa's load backdrop */
function slideLattice(host) {
  const cv = document.createElement('canvas');
  cv.className = 'slide-lattice';
  cv.setAttribute('aria-hidden', 'true');
  host.insertBefore(cv, host.firstChild);
  const ctx = cv.getContext('2d');
  /* the login field's geometry, on the light ground */
  let W = 0, H = 0, P = 24, D = 16, cells = [];
  function build() {
    W = host.clientWidth; H = host.clientHeight;
    if (!W || !H) return false;
    cv.width = Math.round(W * DPR2); cv.height = Math.round(H * DPR2);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR2, 0, 0, DPR2, 0, 0);
    P = W < 700 ? 18 : 24;
    D = P - Math.max(4, Math.round(P / 3));
    const cols = Math.ceil(W / P), rows = Math.ceil(H / P);
    const bx = Math.max(2, cols - 15 - 3), by = 2;  /* logo inside the field, top-right — gate parity */
    cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      /* full field: every cell drawn, dim — texture, not confetti (same move as /work) */
      const s = seedRand(i * 3 + 2), m = seedRand(i * 7 + 4);
      const br = r - by, bc = c - bx;
      const inLogo = br >= 0 && br < 5 && bc >= 0 && bc < 15 && M[br][bc] === '1';
      cells.push({
        x: c * P, y: r * P, inLogo,
        r: TEAL[0] + (MUTE[0] - TEAL[0]) * m,
        g: TEAL[1] + (MUTE[1] - TEAL[1]) * m,
        b: TEAL[2] + (MUTE[2] - TEAL[2]) * m,
        base: 0.03 + 0.10 * s,     /* wide spread: some cells clearly darker, like the closing band */
        freq: inLogo ? 1.1 : 0.8 + 1.2 * seedRand(i * 5 + 9),
        phase: s * Math.PI * 2
      });
    }
    return true;
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    /* cells hold their positions; each one dims and brightens on its own
       seeded rhythm — the /work footer behavior, nothing travels */
    for (const k of cells) {
      const al = k.inLogo
        ? (t === null ? 0.42 : 0.34 + 0.22 * Math.sin(t * k.freq + k.phase))
        : (t === null ? k.base : k.base + 0.07 * Math.sin(t * k.freq + k.phase));
      if (al <= 0) continue;
      ctx.fillStyle = k.inLogo
        ? 'rgba(' + TEAL[0] + ',' + TEAL[1] + ',' + TEAL[2] + ',' + al.toFixed(3) + ')'
        : 'rgba(' + (k.r | 0) + ',' + (k.g | 0) + ',' + (k.b | 0) + ',' + al.toFixed(3) + ')';
      ctx.fillRect(k.x + 1.5, k.y + 1.5, D, D);
    }
  }
  build();
  let rz;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if ((host.clientWidth !== W || host.clientHeight !== H) && build()) draw(still ? null : 0); }, 200);
  });
  return { draw };
}

/* (the slide logo lives inside slideLattice now, gate parity — no separate badge) */
/* ── pixel field (ported from /work): dim cells fill the host, each breathing
   on its own seed; the 15x5 logo sits bright inside the field, top-right ── */
function pxField(host) {
  const cv = document.createElement('canvas');
  cv.className = 'px-grid';
  cv.setAttribute('aria-hidden', 'true');
  host.insertBefore(cv, host.firstChild);
  const ctx = cv.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  const seedRand = (i) => { const x = Math.sin((i + 1) * 127.1) * 43758.5453; return x - Math.floor(x); };
  let W = 0, H = 0, cols = 0, rows = 0, S = 0, D = 0, bx = 0, by = 0;
  function build() {
    W = host.clientWidth; H = host.clientHeight;
    if (!W || !H) { W = 0; return false; }
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = W < 700 ? 18 : 24;                     /* cell pitch */
    D = S - Math.max(4, Math.round(S / 3));    /* dot size */
    cols = Math.ceil(W / S); rows = Math.ceil(H / S);
    bx = Math.max(2, cols - 15 - 3);           /* logo top-right, clear of the text */
    by = 2;
    return true;
  }
  function cellAlpha(r, c, t) {
    const br = r - by, bc = c - bx;
    const inLogo = br >= 0 && br < 5 && bc >= 0 && bc < 15 && M[br][bc] === '1';
    const i = r * cols + c, sr = seedRand(i);
    if (inLogo) return still ? 0.75 : 0.45 + 0.35 * Math.sin(t * 1.1 + sr * 6.28);
    const base = 0.03 + sr * 0.07;
    return still ? base : base + 0.04 * Math.sin(t * 0.7 + sr * 6.28);
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#3BD1D3';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const a = cellAlpha(r, c, t);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.fillRect(c * S, r * S, D, D);
    }
    ctx.globalAlpha = 1;
  }
  if (build()) draw(0);
  let rz;
  // iOS fires resize on every scroll (address-bar collapse): rebuild only on a real size change
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      if ((host.clientWidth !== W || host.clientHeight !== H) && build()) draw(0);
    }, 200);
  });
  const ensure = () => { if (!W && build()) draw(0); };
  if (still || !('IntersectionObserver' in window)) return { ensure };
  let visible = false, raf = 0, last = 0;
  function loop(now) {
    if (!visible || document.hidden || !cv.isConnected) return;
    raf = requestAnimationFrame(loop);
    if (now - last < 66) return;               /* 15fps is plenty for a shimmer */
    last = now;
    draw(now / 1000);
  }
  new IntersectionObserver((es) => {
    es.forEach((en) => {
      visible = en.isIntersecting;
      if (visible) { ensure(); cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(loop); }
    });
  }, { threshold: 0 }).observe(cv);
  return { ensure };
}

pxField(gate);
let closingField = null;

/* decode-in: gate text resolves from glyphs, the homepage move */
function decodeIn(el, delay) {
  const final = el.textContent;
  const GL = '01·▪▫/|\\<>#+';
  const obj = { p: 0 };
  el.textContent = '';
  animate(obj, {
    p: 1, duration: 750, ease: 'outExpo', delay,
    onUpdate: () => {
      const n = Math.floor(obj.p * final.length);
      let out = final.slice(0, n);
      for (let k = n; k < final.length; k++) {
        const ch = final[k];
        out += ch === ' ' ? ' ' : (seedRand(k * 13 + ((obj.p * 60) | 0)) > 0.5 ? GL[(seedRand(k + ((obj.p * 90) | 0)) * GL.length) | 0] : ch);
      }
      el.textContent = out;
    },
    onComplete: () => { el.textContent = final; }
  });
}
if (!still) {
  decodeIn(document.querySelector('.gate-label'), 150);
  decodeIn(document.querySelector('.gate-sub'), 350);
}

const userEl = document.getElementById('user');
const NAMES = ['toffer', 'bernice'];

document.getElementById('gate-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  if (!NAMES.includes(userEl.value.trim().toLowerCase())) {
    err.textContent = 'That’s not it. Try again.';
    userEl.select();
    if (!still) {
      animate(userEl, {
        keyframes: [{ x: -6 }, { x: 6 }, { x: -6 }, { x: 6 }, { x: 0 }],
        duration: 340, ease: 'inOutCirc'
      });
    }
    return;
  }
  try {
    const html = await unlock(passEl.value);
    const deck = document.getElementById('deck');
    deck.innerHTML = html;
    // the closing band gets the same pixel field as /work's closing panel
    const closing = deck.querySelector('.closing');
    if (closing) closingField = pxField(closing);
    if (still) {
      gate.remove();
      initDeck();
    } else {
      // the gate lifts like the homepage boot shutter; slide 1 enters beneath it
      initDeck();
      animate(gate, {
        translateY: '-100%', duration: 560, ease: 'inOutCirc',
        onComplete: () => gate.remove()
      });
    }
  } catch {
    err.textContent = 'That’s not it. Try again.';
    passEl.select();
    if (!still) {
      animate(passEl, {
        keyframes: [{ x: -6 }, { x: 6 }, { x: -6 }, { x: 6 }, { x: 0 }],
        duration: 340, ease: 'inOutCirc'
      });
    }
  }
});

/* ── Deck ────────────────────────────────────────────────── */
function initDeck() {
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll('.slide')];
  const counter = document.getElementById('counter');
  const pipsHost = document.getElementById('pips');
  const pips = slides.map((_, k) => {
    const b = document.createElement('button');
    b.className = 'pip';
    b.setAttribute('aria-label', 'Go to slide ' + (k + 1));
    b.addEventListener('click', () => show(k));
    pipsHost.appendChild(b);
    return b;
  });
  let i = 0;

  deck.classList.add('on');
  document.getElementById('bar').classList.add('on');

  // the login field, light: one breathing lattice behind all slides, logo inside it
  const lattice = slideLattice(deck);
  if (still) {
    lattice.draw(null);
  } else {
    let lastB = 0;
    const loopBg = (now) => {
      requestAnimationFrame(loopBg);
      if (document.hidden || now - lastB < 66) return; /* 15fps is plenty for a shimmer */
      lastB = now;
      lattice.draw(now / 1000);
    };
    requestAnimationFrame(loopBg);
  }

  const pad = (n) => String(n).padStart(2, '0');

  // Shared enter timeline, reused on every slide change.
  const enter = (slide, dir) => createTimeline({ defaults: { ease: 'outExpo', duration: 520 } })
    .add(slide, { opacity: [0, 1], translateX: [(dir || 1) * 36, 0] })
    .add(slide.querySelectorAll('.rise'), {
      opacity: [0, 1],
      translateY: [8, 0],
      delay: stagger(45)
    }, '<-=380');

  // Any slide with .draw paths gets the whiteboard stroke-draw, marker order.
  // Diagram labels hide first, then fade in once their shapes exist.
  const drawShapes = (slide) => {
    const paths = slide.querySelectorAll('.draw');
    paths.forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
    animate(paths, {
      strokeDashoffset: 0,
      duration: 700,
      ease: 'inOutCirc',
      delay: stagger(paths.length > 10 ? 90 : 180, { start: 260 })
    });
    const labels = slide.querySelectorAll('.dlabel');
    if (labels.length) {
      labels.forEach((l) => { l.style.opacity = 0; });
      animate(labels, {
        opacity: [0, 1],
        duration: 400,
        ease: 'outExpo',
        delay: stagger(40, { start: 800 })
      });
    }
  };

  // Slide 12: the chain assembles left to right.
  const drawChain = (slide) => {
    animate(slide.querySelectorAll('.chain-node, .chain-arrow'), {
      opacity: [0, 1],
      translateX: [-12, 0],
      duration: 520,
      ease: 'outExpo',
      delay: stagger(90, { start: 200 })
    });
  };

  // Verified stats tick up as their slide enters.
  const tick = (slide) => {
    slide.querySelectorAll('.tick').forEach((el) => {
      const n = parseInt(el.dataset.n, 10);
      const comma = el.dataset.f === 'comma';
      const obj = { v: 0 };
      animate(obj, {
        v: n, duration: 1100, ease: 'outExpo', delay: 380,
        onUpdate: () => {
          const x = Math.round(obj.v);
          el.textContent = comma ? x.toLocaleString('en-US') : String(x);
        }
      });
    });
  };

  // Slide 14: size the closing pixel field once its band is visible.
  const drawClose = () => { if (closingField) closingField.ensure(); };

  // The counter digits decode on every slide change.
  const setCounter = (final) => {
    if (still) { counter.textContent = final; return; }
    const obj = { p: 0 };
    animate(obj, {
      p: 1, duration: 240, ease: 'linear',
      onUpdate: () => {
        counter.textContent = obj.p >= 1 ? final
          : final.replace(/\d/g, (d) => (obj.p > 0.5 && Math.random() > 0.5) ? d : String((Math.random() * 10) | 0));
      },
      onComplete: () => { counter.textContent = final; }
    });
  };

  function show(n) {
    const target = Math.max(0, Math.min(slides.length - 1, n));
    const dir = target >= i ? 1 : -1;
    const prev = slides[i];
    i = target;
    const slide = slides[i];
    setCounter(`${pad(i + 1)} / ${pad(slides.length)}`);
    pips.forEach((b, k) => b.classList.toggle('on', k === i));
    slide.querySelector('.frame').scrollTop = 0;
    if (slide.classList.contains('slide-close')) drawClose(); // sizes the field; static under reduced motion
    if (still) {
      slides.forEach((s, k) => s.classList.toggle('active', k === i));
      return; // end state is the CSS default; nothing to animate
    }
    if (prev !== slide && prev.classList.contains('active')) {
      // outgoing slide glides away in the travel direction
      animate(prev, {
        opacity: [1, 0], translateX: [0, -dir * 28], duration: 260, ease: 'outQuad',
        onComplete: () => { prev.classList.remove('active'); prev.style.opacity = ''; prev.style.transform = ''; }
      });
    }
    slide.style.opacity = ''; slide.style.transform = '';
    slide.classList.add('active');
    enter(slide, dir);
    if (slide.querySelector('.draw')) drawShapes(slide);
    if (slide.classList.contains('slide-chain')) drawChain(slide);
    tick(slide);
  }

  document.getElementById('next').addEventListener('click', () => show(i + 1));
  document.getElementById('prev').addEventListener('click', () => show(i - 1));

  // scroll advances the deck — one gesture, one slide; inner content scrolls first
  let lock = false, acc = 0;
  const advance = (dir) => {
    if (lock) return;
    lock = true; acc = 0;
    show(i + dir);
    setTimeout(() => { lock = false; }, 620);
  };
  document.addEventListener('wheel', (e) => {
    const f = slides[i].querySelector('.frame');
    if (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
      // let a scrollable frame consume vertical scroll until it hits its edge
      if (e.deltaY > 0 && f.scrollTop + f.clientHeight < f.scrollHeight - 2) return;
      if (e.deltaY < 0 && f.scrollTop > 2) return;
    }
    e.preventDefault();
    if (lock) return;
    const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (d === 0) return;
    if ((acc > 0) !== (d > 0)) acc = 0;
    acc += d;
    if (Math.abs(acc) > 90) advance(acc > 0 ? 1 : -1);
  }, { passive: false });

  // horizontal swipe on touch — vertical touch keeps scrolling the frame
  let tx = 0, ty = 0;
  document.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) advance(dx < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
  });

  show(0);
}
</script>
